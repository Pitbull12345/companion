[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "companion"
version = "0.1.0"
description = "Local-first speech companion"
requires-python = ">=3.11"

[project.scripts]
companion = "companion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
